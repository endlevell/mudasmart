<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t d">
  <title id="t">MUDASmart — Crescent Scan</title>
  <desc id="d">Bulan sabin di dalam bingkai pemindai QR, warna hijau Muhammadiyah.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16A374"/>
      <stop offset="1" stop-color="#0B6E4F"/>
    </linearGradient>
    <mask id="cut">
      <rect width="240" height="240" fill="#fff"/>
      <circle cx="141" cy="105" r="39" fill="#000"/>
    </mask>
  </defs>

  <!-- Bingkai pemindai -->
  <g fill="none" stroke="#0B6E4F" stroke-width="13" stroke-linecap="round">
    <path d="M91 57 H71 Q57 57 57 71 V91"/>
    <path d="M149 57 H169 Q183 57 183 71 V91"/>
    <path d="M183 149 V169 Q183 183 169 183 H149"/>
    <path d="M91 183 H71 Q57 183 57 169 V149"/>
  </g>

  <!-- Bulan sabin -->
  <circle cx="120" cy="123" r="47" fill="url(#grad)" mask="url(#cut)"/>

  <!-- Kilau -->
  <path transform="translate(148 97) scale(0.85)" fill="#16A374"
        d="M0 -15 Q3.2 -3.2 15 0 Q3.2 3.2 0 15 Q-3.2 3.2 -15 0 Q-3.2 -3.2 0 -15 Z"/>
</svg>
